        <header id="top-bar">

                <div class="tabs-row">
                    <button class="tab-btn tab-prologue" data-stage="1" title="1. Le Monde d'avant">1. Monde d'avant</button>

                    <button class="tab-btn tab-rr group-start" data-stage="3" title="3. Le Train de Lumière">3. Train de lumière</button>

                    <button class="tab-btn tab-rr" data-stage="5" title="5. La Simultanéité">5. Simultanéité</button>
                    <button class="tab-btn tab-rr" data-stage="6" title="6. Les Jumeaux">6. Jumeaux</button>
                    <button class="tab-btn tab-rr" data-stage="7" title="7. Lorentz / E=mc²">7. Lorentz/E=mc²</button>
                </div>

                <!-- Ligne 2 : RG (8-12) + Quantique (13) + Épilogue (14) -->
                <div class="tabs-row">
                    <button class="tab-btn tab-rg" data-stage="8" title="8. L'Ascenseur d'Einstein">8. Ascenseur</button>
                    <button class="tab-btn tab-rg" data-stage="9" title="9. La Courbure de l'espace-temps">9. Courbure</button>
                    <button class="tab-btn tab-rg" data-stage="10" title="10. Le Puits gravitationnel">10. Puits grav.</button>
                    <button class="tab-btn tab-rg" data-stage="11" title="11. Lentille gravitationnelle">11. Lentille</button>
                    <button class="tab-btn tab-rg" data-stage="12" title="12. Trou noir">12. Trou noir</button>
                    
                    <button class="tab-btn tab-q group-start" data-stage="13" title="13. Frontière quantique">13. Quantique</button>
                    
                    <button class="tab-btn tab-epilogue group-start" data-stage="14" title="14. Épilogue">14. Épilogue</button>
                </div>
            </nav>
        </header>

        <main id="main-content">
            <aside id="sidebar">
                <div class="sidebar-header">
                    <div id="chapter-domain" class="domain-badge">PROLOGUE</div>
                    <h1 id="stage-title">Chargement...</h1>
					<div id="stage-number" class="stage-number"></div>
                </div>
                <div id="narrative-text" class="narrative-body"></div>
                <div id="controls-container" class="controls-container"></div>
            </aside>

            <section id="canvas-container">
                <canvas id="sim-canvas"></canvas>
                <div id="citation-zone" class="citation-zone"></div>
            </section>
        </main>

        <footer id="bottom-bar">
            <div class="footer-nav">
                <button id="btn-prev-step" class="tool-btn">← Précédent</button>
                <span id="step-indicator" class="step-indicator">1 / 1</span>
                <button id="btn-next-step" class="tool-btn">Suivant →</button>
            </div>
            <div class="footer-controls">
                <button id="btn-replay" class="tool-btn icon-btn" title="Relancer l'animation">↻</button>
                <button id="btn-sound-toggle" class="tool-btn icon-btn" title="Activer / Désactiver le son">
                    <span id="sound-icon">🔇</span>
                </button>
                <button id="btn-play-pause" class="tool-btn icon-btn" title="Pause / Play">⏸</button>
                <select id="speed-select" class="speed-select" title="Vitesse de l'animation">
                    <option value="0.5">x0.5</option>
                    <option value="1" selected>x1.0</option>
                    <option value="2">x2.0</option>
                </select>
            </div>
        </footer>
